<meta charset="UTF-8">

<style>

    a {
        text-decoration: none;
        color: inherit;
        display: block;
    }

    a:visited,
    a:hover,
    a:active {
        text-decoration: none;
        color: inherit;
    }


    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }


    body {
        background-color: black;
        color: gold;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
    }


    /* MAIN CONTAINER */

    .container {
        width: 100%;
        max-width: 700px;
        margin: auto;
        padding: 15px;
    }


    /* TOP SECTION */

    .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }


    /* LOGO */

    .logo-button {
        background-color: black;
        border: 2px solid gold;
        border-radius: 20px;
        width: 100%;
        max-width: 400px;
        height: 80px;
        padding: 0;
        overflow: hidden;
        cursor: pointer;
    }


    .logo-button img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 18px;
    }


    /* PROFILE BUTTON */

    .profile-button {
        background-color: transparent;
        border: 2px solid gold;
        border-radius: 50%;
        width: 65px;
        height: 65px;
        padding: 5px;
        flex-shrink: 0;
        cursor: pointer;
    }


    .profile-button img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
    }


    /* WELCOME */

    .welcome {
        margin-top: 25px;
        margin-bottom: 20px;
        text-align: center;
    }


    .welcome h2 {
        font-size: 24px;
        line-height: 1.4;
    }


    /* LOGIN BUTTON */

    .login-section {
        display: flex;
        justify-content: center;
        margin-bottom: 25px;
    }


    .login-button {
        background-color: black;
        color: gold;
        border: 2px solid gold;
        border-radius: 25px;
        padding: 12px 30px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }


    .login-button:hover {
        background-color: rgba(255, 215, 0, 0.08);
    }


    /* MENU GRID */

    .menu {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        width: 100%;
    }


    /* MENU BUTTON */

    .menu-button {
        background-color: transparent;
        color: gold;
        border: 2px solid gold;
        border-radius: 30px;
        min-height: 150px;
        width: 100%;
        cursor: pointer;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        padding: 10px;
    }


    .menu-button:hover {
        background-color: rgba(255, 215, 0, 0.08);
    }


    .menu-button img {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 10px;
    }


    .menu-button h2 {
        font-size: 18px;
    }


    /* BALANCE AND WITHDRAW */

    .wide-menu {
        grid-column: span 2;
        min-height: 65px;
        flex-direction: row;
        justify-content: center;
        gap: 15px;
    }


    .wide-menu img {
        width: 40px;
        height: 40px;
        margin: 0;
    }


    .wide-menu h2 {
        margin: 0;
        font-size: 20px;
    }


    /* TRADEMARK */

    .trademark {
        display: flex;
        justify-content: center;
        margin-top: 20px;
        margin-bottom: 20px;
    }


    .trademark img {
        max-width: 200px;
        width: 70%;
        height: auto;
    }


    /* PHONE DESIGN */

    @media (max-width: 500px) {

        .container {
            padding: 12px;
        }


        .logo-button {
            height: 65px;
        }


        .profile-button {
            width: 55px;
            height: 55px;
        }


        .welcome {
            margin-top: 20px;
            margin-bottom: 20px;
        }


        .welcome h2 {
            font-size: 18px;
        }


        .login-button {
            font-size: 15px;
            padding: 10px 25px;
        }


        .menu {
            gap: 12px;
        }


        .menu-button {
            min-height: 135px;
            border-radius: 25px;
        }


        .menu-button img {
            width: 45px;
            height: 45px;
        }


        .menu-button h2 {
            font-size: 16px;
        }


        .wide-menu {
            min-height: 60px;
        }


        .wide-menu h2 {
            font-size: 17px;
        }


        .wide-menu img {
            width: 35px;
            height: 35px;
        }

    }


    /* VERY SMALL PHONES */

    @media (max-width: 350px) {

        .top {
            gap: 5px;
        }


        .logo-button {
            height: 55px;
        }


        .profile-button {
            width: 50px;
            height: 50px;
        }


        .welcome h2 {
            font-size: 16px;
        }


        .login-button {
            font-size: 14px;
            padding: 9px 20px;
        }


        .menu {
            gap: 8px;
        }


        .menu-button {
            min-height: 120px;
        }


        .menu-button h2 {
            font-size: 14px;
        }


        .menu-button img {
            width: 40px;
            height: 40px;
        }


        .wide-menu h2 {
            font-size: 15px;
        }

    }

</style>

</div>

<script>

async function loadUser() {

    try {

        const response =
            await fetch("/me");


        const result =
            await response.json();


        /*
         * IMPORTANT:
         *
         * Do NOT redirect to login if the
         * visitor is not logged in.
         *
         * The homepage is public.
         */

        if (!result.loggedIn) {

            document.getElementById(
                "welcome"
            ).textContent =

                "Welcome to cryptpay.ng!";

            return;

        }


        /*
         * If the user is logged in,
         * personalize the welcome message.
         */

        const user =
            result.user;


        document.getElementById(
            "welcome"
        ).textContent =

            `Welcome, ${user.username}! Ready to start earning today? Complete daily goals, earn big and withdraw.`;

    }

    catch (error) {

        console.error(
            "Error loading user:",
            error
        );

        /*
         * If /me fails, simply keep
         * the public homepage visible.
         */

        document.getElementById(
            "welcome"
        ).textContent =

            "Welcome to cryptpay.ng!";

    }

}


loadUser();


</script>
