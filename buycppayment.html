<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CP Code Payment</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: black;
            color: gold;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 20px;
        }

        .back {
            width: 55px;
            height: 55px;
            border: 2px solid gold;
            border-radius: 50%;
            background: transparent;
            padding: 3px;
        }

        .back img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .box {
            margin-top: 30px;
            border: 2px solid gold;
            border-radius: 25px;
            padding: 25px;
            text-align: center;
        }

        .box h1 {
            font-size: 28px;
        }

        .amount {
            font-size: 32px;
            font-weight: bold;
            margin: 25px 0;
        }

        .account {
            border: 1px solid gold;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
        }

        .account p {
            margin: 10px 0;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: gold;
            color: black;
            border-radius: 10px;
        }

        .submit {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background-color: gold;
            color: black;
            border: 2px solid gold;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            line-height: 1.5;
        }

        #code {
            margin-top: 20px;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .copy-button {
    width: auto;
    padding: 6px 12px;
    margin-left: 8px;
    margin-top: 0;

    background-color: transparent;
    color: gold;

    border: 1px solid gold;
    border-radius: 8px;

    font-size: 14px;
    cursor: pointer;
}

.copy-button:hover {
    background-color: gold;
    color: black;
}

    </style>

</head>


<body>

<div class="container">


    <a href="cryptpay.html">

        <button class="back">

            <img
                src="cryptpaybackkey.png"
                alt="Back"
            >

        </button>

    </a>


    <div class="box">

        <h1>Buy CP Code</h1>


        <div class="amount">
            NGN10,000
        </div>


        <div class="account">

            <h2> Cryptpay Payment Details</h2>

            <p>
                <b>Bank:</b>
                MoniePoint MFB
            </p>

            <p>
    <b>Account Number:</b>
    <span id="accountNumber">7064985861</span>

    <button
        type="button"
        class="copy-button"
        onclick="copyAccountNumber(event)"
    >
        Copy
    </button>
            </p>

           
            <p>
                <b>Amount:</b>
                NGN10,000
            </p>



        </div>


        <h3>
            Upload payment screenshot
        </h3>


        <form
            id="paymentForm"
            enctype="multipart/form-data"
        >

            <input
                type="file"
                id="proof"
                name="proof"
                accept="image/*"
                required
            >


            <button
                class="submit"
                type="submit"
            >
                CHECK PAYMENT
            </button>

        </form>


        <div id="message"></div>

        <div id="code"></div>

    </div>

</div>


<script>

const form =
    document.getElementById(
        "paymentForm"
    );


const message =
    document.getElementById(
        "message"
    );


const code =
    document.getElementById(
        "code"
    );


form.addEventListener(
    "submit",

    async function(event) {

        event.preventDefault();


        message.textContent =
            "Checking image...";


        code.textContent =
            "";


        const file =
            document.getElementById(
                "proof"
            ).files[0];


        if (!file) {

            message.textContent =
                "Please upload a picture.";

            return;

        }


        const formData =
            new FormData();


        formData.append(
            "proof",
            file
        );


        try {

            const response =
                await fetch(
                    "/submit-payment-proof",
                    {

                        method: "POST",

                        body: formData

                    }
                );


            const result =
                await response.json();


            message.textContent =
                result.message;


            if (result.success) {

                code.textContent =
                    "CP CODE: " +
                    result.code;

            }

        }

        catch (error) {

            console.error(error);


            message.textContent =
                "payment not confirmed. Try again";

        }

    }

);

async function copyAccountNumber() {

    const accountNumber =
        document.getElementById("accountNumber").textContent;

    const button =
        event.currentTarget;

    try {

        await navigator.clipboard.writeText(
            accountNumber
        );

        button.textContent = "Copied!";

        setTimeout(function() {

            button.textContent = "Copy";

        }, 2000);

    } catch (error) {

        alert(
            "Unable to copy the account number."
        );

    }
}

async function copyAccountNumber(event) {

    const accountNumber =
        document.getElementById("accountNumber").textContent;

    const button =
        event.currentTarget;

    try {

        await navigator.clipboard.writeText(accountNumber);

        button.textContent = "Copied!";

        setTimeout(function() {
            button.textContent = "Copy";
        }, 2000);

    } catch (error) {

        alert("Unable to copy the account number.");

    }
}
</script>

</body>

</html>
