<!DOCTYPE html>
<html lang="en">


<head>

    <link rel="icon" type="image/png" href="favicon.png">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1546729568940222"
         crossorigin="anonymous"></script>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>cryptpaylogin</title>

    <link rel="stylesheet" href="style.css">


    <style>

        /* ==================================================
           GOLD STAR SPACE BACKGROUND
           ================================================== */

        body {
            position: relative;
            background-color: #141414;
            color: gold;
            overflow-x: hidden;
        }


        /* Star layers */

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }


        /* ==================================================
           SMALL GOLD STARS
           ================================================== */

        body::before {

            background-image:

                radial-gradient(
                    circle,
                    gold 1px,
                    transparent 2px
                ),

                radial-gradient(
                    circle,
                    gold 1px,
                    transparent 2px
                ),

                radial-gradient(
                    circle,
                    #ffd700 1px,
                    transparent 2px
                ),

                radial-gradient(
                    circle,
                    #fff0a0 1px,
                    transparent 2px
                );

            background-size:

                90px 90px,
                130px 130px,
                170px 170px,
                220px 220px;

            background-position:

                10px 20px,
                50px 80px,
                100px 40px,
                30px 120px;

            opacity: 0.8;

            animation: starsMove 12s linear infinite;
        }


        /* ==================================================
           LARGE GLOWING STARS
           ================================================== */

        body::after {

            background-image:

                radial-gradient(
                    circle,
                    rgba(255,215,0,1) 0px,
                    rgba(255,215,0,.8) 2px,
                    rgba(255,215,0,.25) 5px,
                    transparent 12px
                ),

                radial-gradient(
                    circle,
                    rgba(255,215,0,1) 0px,
                    rgba(255,215,0,.7) 2px,
                    rgba(255,215,0,.2) 6px,
                    transparent 14px
                ),

                radial-gradient(
                    circle,
                    rgba(255,240,160,1) 0px,
                    rgba(255,215,0,.6) 2px,
                    transparent 10px
                );

            background-size:

                260px 260px,
                340px 340px,
                430px 430px;

            background-position:

                40px 70px,
                180px 20px,
                90px 160px;

            opacity: 0.7;

            animation: starsGlow 3s ease-in-out infinite alternate;
        }


        /* ==================================================
           STAR MOVEMENT
           ================================================== */

        @keyframes starsMove {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0);
            }

        }


        /* ==================================================
           STAR TWINKLING
           ================================================== */

        @keyframes starsGlow {

            0% {
                opacity: 0.35;
                filter: brightness(0.8);
            }

            50% {
                opacity: 0.9;
                filter: brightness(1.5);
            }

            100% {
                opacity: 0.45;
                filter: brightness(1);
            }

        }


        /* Keep login container above the stars */

        .register-container {
            position: relative;
            z-index: 1;
        }

    </style>


</head>


<body>

    <div
        style="background-color: black; color: gold; border: 20px"
        class="register-container"
    >

        <h1>
            Cryptpay Login
        </h1>


        <form id="loginForm">

            <label for="username">
                Username
            </label>


            <input
                style="background-color: gold; border-color: gold; color: black"
                type="text"
                id="username"
                required
            >


            <label for="password">
                Password
            </label>


            <input
                style="background-color: gold; border-color: gold; color: black"
                type="password"
                id="password"
                required
            >


            <button
                style="background-color: black; color: gold"
                type="submit"
            >
                Login
            </button>

        </form>


        <p id="message"></p>


        <p>

            Don't have an account?

            <a
                style="color: white"
                href="register.html"
            >
                Register
            </a>

        </p>

    </div>


    <script src="login.js"></script>

</body>

</html>
