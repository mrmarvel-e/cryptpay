<!DOCTYPE html>
<html lang="en">

<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1546729568940222"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>cryptpaylogin</title>

    <link rel="stylesheet" href="style.css">



</head>

<body style="background-color: #141414">

    <div style="background-color: black; color: gold; border: 20px" class="register-container">

        <h1> Cryptpay Login</h1>

        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                style="background-color: gold; border-color: gold; color: black"
                type="text"
                id="username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                style="background-color: gold; border-color: gold; color: black"
                type="password"
                id="password"
                required
            >

            <button style="background-color: black; color: gold" type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <p>
            Don't have an account?
            <a style="color: white" href="register.html">
                Register
            </a>
        </p>

    </div>

    <script src="login.js"></script>

</body>

</html>
