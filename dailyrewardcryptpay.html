<!DOCTYPE html>

<html lang="en">

<head>
    <link rel="icon" type="image/png" href="favicon.png">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Daily Reward - Cryptpay</title>


<style>
/* ==================================================
   GOLD STAR SPACE BACKGROUND
   ================================================== */

body {
    position: relative;
    background-color: black;
    color: gold;
    overflow-x: hidden;
}

/* Star layers */

body::before,
body::after {
    content: "";
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: -1;
}


/* ==================================================
   SMALL GOLD STARS
   ================================================== */

body::before {

    background-image:

        radial-gradient(
            circle,
            gold 1px,
            transparent 2px
        ),

        radial-gradient(
            circle,
            gold 1px,
            transparent 2px
        ),

        radial-gradient(
            circle,
            #ffd700 1px,
            transparent 2px
        ),

        radial-gradient(
            circle,
            #fff0a0 1px,
            transparent 2px
        );

    background-size:

        90px 90px,
        130px 130px,
        170px 170px,
        220px 220px;

    background-position:

        10px 20px,
        50px 80px,
        100px 40px,
        30px 120px;

    opacity: 0.8;

    animation:
        starsMove 12s linear infinite;
}


/* ==================================================
   LARGE GLOWING STARS
   ================================================== */

body::after {

    background-image:

        radial-gradient(
            circle,
            rgba(255,215,0,1) 0px,
            rgba(255,215,0,.8) 2px,
            rgba(255,215,0,.25) 5px,
            transparent 12px
        ),

        radial-gradient(
            circle,
            rgba(255,215,0,1) 0px,
            rgba(255,215,0,.7) 2px,
            rgba(255,215,0,.2) 6px,
            transparent 14px
        ),

        radial-gradient(
            circle,
            rgba(255,240,160,1) 0px,
            rgba(255,215,0,.6) 2px,
            transparent 10px
        );

    background-size:

        260px 260px,
        340px 340px,
        430px 430px;

    background-position:

        40px 70px,
        180px 20px,
        90px 160px;

    opacity: 0.7;

    animation:
        starsGlow 3s ease-in-out infinite alternate;
}


/* ==================================================
   STAR MOVEMENT
   ================================================== */

@keyframes starsMove {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }

    100% {
        transform: translateY(0);
    }

}


/* ==================================================
   STAR TWINKLING
   ================================================== */

@keyframes starsGlow {

    0% {
        opacity: 0.35;
        filter: brightness(0.8);
    }

    50% {
        opacity: 0.9;
        filter: brightness(1.5);
    }

    100% {
        opacity: 0.45;
        filter: brightness(1);
    }

}
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }


    body {

        background-color: black;

        color: gold;

        font-family: Arial, sans-serif;

        min-height: 100vh;

        overflow-x: hidden;

    }


    /* =========================
       NOTIFICATION
    ========================= */

    #notification {

        position: fixed;

        top: 20px;

        left: 50%;

        transform: translateX(-50%);

        background-color: gold;

        color: black;

        padding: 15px 25px;

        border-radius: 15px;

        font-size: 18px;

        font-weight: bold;

        display: none;

        z-index: 9999;

        text-align: center;

        width: max-content;

        max-width: 90%;

    }


    /* =========================
       MAIN CONTAINER
    ========================= */

    .container {

        width: 100%;

        max-width: 600px;

        min-height: 100vh;

        margin: auto;

        padding: 20px;

        display: flex;

        flex-direction: column;

        align-items: center;

    }


    /* =========================
       CONGRATULATIONS IMAGE
    ========================= */

    .congratulations {

        width: 100%;

        max-width: 550px;

        height: auto;

        border-radius: 30px;

        display: block;

    }


    /* =========================
       BUTTONS AREA
    ========================= */

    .buttons {

        width: 100%;

        display: flex;

        justify-content: center;

        align-items: center;

        gap: 20px;

        margin-top: 30px;

    }


    /* =========================
       CLAIM BUTTON
    ========================= */

    .claim-button {

        width: 180px;

        height: 60px;

        background-color: gold;

        color: black;

        border: 2px solid gold;

        border-radius: 20px;

        font-size: 20px;

        font-weight: bold;

        cursor: pointer;

    }


    .claim-button:hover {

        background-color: black;

        color: gold;

    }


    .claim-button:disabled {

        opacity: 0.5;

        cursor: not-allowed;

    }


    /* =========================
       HOME BUTTON
    ========================= */

    .home-button {

        width: 65px;

        height: 65px;

        background-color: transparent;

        color: gold;

        border: 2px solid gold;

        border-radius: 50%;

        padding: 5px;

        cursor: pointer;

    }


    .home-button img {

        width: 100%;

        height: 100%;

        border-radius: 50%;

        object-fit: cover;

    }


    /* =========================
       PHONE
    ========================= */

    @media (max-width: 500px) {

        .container {

            padding: 12px;

        }


        .congratulations {

            width: 100%;

            border-radius: 20px;

        }


        .buttons {

            margin-top: 20px;

            gap: 12px;

        }


        .claim-button {

            width: 160px;

            height: 55px;

            font-size: 18px;

        }


        .home-button {

            width: 60px;

            height: 60px;

        }


        #notification {

            font-size: 16px;

        }

    }


    /* =========================
       VERY SMALL PHONES
    ========================= */

    @media (max-width: 350px) {

        .buttons {

            gap: 8px;

        }


        .claim-button {

            width: 145px;

            font-size: 16px;

        }


        .home-button {

            width: 55px;

            height: 55px;

        }

    }

</style>

</head>


<body>


<!-- =========================
     NOTIFICATION
========================= -->

<div id="notification"></div>


<div class="container">


<!-- =========================
     CONGRATULATIONS IMAGE
========================= -->

<img

    class="congratulations"

    src="cryptpaycongratulations.png"

    alt="Congratulations"

>


<!-- =========================
     BUTTONS
========================= -->

<div class="buttons">


    <!-- CLAIM NOW -->

    <button

        class="claim-button"

        id="claimButton"

        onclick="claimDailyReward()"

    >

        CLAIM NOW!

    </button>


    <!-- HOME -->

    <a href="cryptpay.html">

        <button class="home-button">

            <img

                src="cryptpayhomepic.png"

                alt="Home"

            >

        </button>

    </a>


</div>


</div>



<script>


// ========================================
// CLAIM DAILY REWARD
// ========================================

async function claimDailyReward() {

    const button =
        document.getElementById(
            "claimButton"
        );


    // Prevent multiple clicks

    button.disabled = true;


    try {

        const response =
            await fetch(
                "/claim-reward",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        goal: "daily"

                    })

                }

            );


        const result =
            await response.json();


        // ================================
        // FAILED
        // ================================

        if (!result.success) {

            showNotification(
                result.message
            );


            button.disabled = false;


            return;

        }


        // ================================
        // SUCCESS
        // ================================

        showNotification(
            result.message
        );

    }


    catch (error) {

        console.error(error);


        showNotification(
            "Unable to claim reward. Please try again."
        );


        button.disabled = false;

    }

}



// ========================================
// SHOW NOTIFICATION
// ========================================

function showNotification(message) {

    const notification =
        document.getElementById(
            "notification"
        );


    notification.textContent =
        message;


    notification.style.display =
        "block";


    setTimeout(function() {

        notification.style.display =
            "none";

    }, 3000);

}



// ========================================
// CHECK LOGIN
// ========================================

async function checkLogin() {

    try {

        const response =
            await fetch("/me");


        const result =
            await response.json();


        if (!result.loggedIn) {

            window.location.href =
                "login.html";

            return;

        }

    }

    catch (error) {

        console.error(error);

    }

}


checkLogin();


</script>


</body>

</html>
