<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Buy CP Code</title>

<style>
 /* ==================================================
    GOLD STAR SPACE BACKGROUND
    ================================================== */

body {
    position: relative;
    background-color: black;
    color: gold;
    overflow-x: hidden;
}

/* Star layers */

body::before,
body::after {
    content: "";
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: -1;
}


/* ==================================================
   SMALL GOLD STARS
   ================================================== */

body::before {

    background-image:

        radial-gradient(
            circle,
            gold 1px,
            transparent 2px
        ),

        radial-gradient(
            circle,
            gold 1px,
            transparent 2px
        ),

        radial-gradient(
            circle,
            #ffd700 1px,
            transparent 2px
        ),

        radial-gradient(
            circle,
            #fff0a0 1px,
            transparent 2px
        );

    background-size:

        90px 90px,
        130px 130px,
        170px 170px,
        220px 220px;

    background-position:

        10px 20px,
        50px 80px,
        100px 40px,
        30px 120px;

    opacity: 0.8;

    animation: starsMove 12s linear infinite;
}


/* ==================================================
   LARGE GLOWING STARS
   ================================================== */

body::after {

    background-image:

        radial-gradient(
            circle,
            rgba(255,215,0,1) 0px,
            rgba(255,215,0,.8) 2px,
            rgba(255,215,0,.25) 5px,
            transparent 12px
        ),

        radial-gradient(
            circle,
            rgba(255,215,0,1) 0px,
            rgba(255,215,0,.7) 2px,
            rgba(255,215,0,.2) 6px,
            transparent 14px
        ),

        radial-gradient(
            circle,
            rgba(255,240,160,1) 0px,
            rgba(255,215,0,.6) 2px,
            transparent 10px
        );

    background-size:

        260px 260px,
        340px 340px,
        430px 430px;

    background-position:

        40px 70px,
        180px 20px,
        90px 160px;

    opacity: 0.7;

    animation: starsGlow 3s ease-in-out infinite alternate;
}


/* ==================================================
   STAR MOVEMENT
   ================================================== */

@keyframes starsMove {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }

    100% {
        transform: translateY(0);
    }

}


/* ==================================================
   STAR TWINKLING
   ================================================== */

@keyframes starsGlow {

    0% {
        opacity: 0.35;
        filter: brightness(0.8);
    }

    50% {
        opacity: 0.9;
        filter: brightness(1.5);
    }

    100% {
        opacity: 0.45;
        filter: brightness(1);
    }

}
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: black;
        color: gold;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* Removes link underlines */
    a {
        text-decoration: none;
        color: inherit;
    }

    a:visited,
    a:hover,
    a:active {
        text-decoration: none;
        color: inherit;
    }

    /* Main page */
    .container {
        width: 100%;
        max-width: 500px;
        margin: auto;
        padding: 20px;
    }

    /* Back button */
    .back-button {
        width: 55px;
        height: 55px;
        background-color: transparent;
        color: gold;
        border: 2px solid gold;
        border-radius: 50%;
        padding: 2px;
        cursor: pointer;
    }

    .back-button img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
    }

    /* CP Code information */
    .code-info {
        text-align: center;
        margin-top: 20px;
    }

    .code-info img {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        object-fit: cover;
    }

    .code-info h4 {
        font-size: 21px;
        line-height: 1.5;
        margin-top: 20px;
        font-weight: normal;
    }

    /* Purchase heading */
    .purchase-title {
        width: 100%;
        min-height: 60px;

        display: flex;
        align-items: center;
        justify-content: center;

        background-color: gold;
        color: black;

        border-radius: 20px;

        margin-top: 25px;
        padding: 10px 15px;
    }

    .purchase-title b {
        font-size: 20px;
        text-align: center;
    }

    /* Proceed button */
    .proceed-button {
        display: block;

        width: 160px;
        height: 45px;

        margin: 20px auto;

        background-color: transparent;
        color: gold;

        border: 2px solid gold;
        border-radius: 10px;

        font-size: 18px;
        font-weight: bold;

        cursor: pointer;
    }

    .proceed-button:hover {
        background-color: gold;
        color: black;
    }

    /* Phone */
    @media (max-width: 500px) {

        .container {
            padding: 15px;
        }

        .code-info img {
            width: 160px;
            height: 160px;
        }

        .code-info h4 {
            font-size: 18px;
        }

        .purchase-title b {
            font-size: 17px;
        }

    }

    /* Very small phones */
    @media (max-width: 350px) {

        .code-info img {
            width: 140px;
            height: 140px;
        }

        .code-info h4 {
            font-size: 16px;
        }

        .purchase-title {
            min-height: 65px;
        }

        .purchase-title b {
            font-size: 15px;
        }

    }

</style>


</head>

<body>

<div class="container">


<!-- BACK BUTTON -->

</a>


<!-- INFORMATION -->
<div class="code-info">

    <h4>

        Code is valid for only 24 hours.

</div>


<!-- PURCHASE METHOD -->
<div class="purchase-title">

    <b>
        Purchase CP code @ NGN10,000 via bank transfer
    </b>

</div>


<!-- PROCEED -->
<a href="buycppayment.html">

    <button class="proceed-button">
        Proceed
    </button>

</a>


</div>

</body>

</html>
