<!DOCTYPE html>

<html lang="en">

<head>
<link rel="icon" type="image/png" href="favicon.png">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1546729568940222"
     crossorigin="anonymous"></script>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>CryptPay Balance</title>

<style>
/* ==================================================
   GOLD STAR SPACE BACKGROUND
   ================================================== */

body {
    position: relative;
    background-color: black;
    color: gold;
    overflow-x: hidden;
}

/* Star layers */

body::before,
body::after {
    content: "";
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: -1;
}


/* ==================================================
   SMALL GOLD STARS
   ================================================== */

body::before {

    background-image:

        radial-gradient(
            circle,
            gold 1px,
            transparent 2px
        ),

        radial-gradient(
            circle,
            gold 1px,
            transparent 2px
        ),

        radial-gradient(
            circle,
            #ffd700 1px,
            transparent 2px
        ),

        radial-gradient(
            circle,
            #fff0a0 1px,
            transparent 2px
        );

    background-size:

        90px 90px,
        130px 130px,
        170px 170px,
        220px 220px;

    background-position:

        10px 20px,
        50px 80px,
        100px 40px,
        30px 120px;

    opacity: 0.8;

    animation: starsMove 12s linear infinite;
}


/* ==================================================
   LARGE GLOWING STARS
   ================================================== */

body::after {

    background-image:

        radial-gradient(
            circle,
            rgba(255,215,0,1) 0px,
            rgba(255,215,0,.8) 2px,
            rgba(255,215,0,.25) 5px,
            transparent 12px
        ),

        radial-gradient(
            circle,
            rgba(255,215,0,1) 0px,
            rgba(255,215,0,.7) 2px,
            rgba(255,215,0,.2) 6px,
            transparent 14px
        ),

        radial-gradient(
            circle,
            rgba(255,240,160,1) 0px,
            rgba(255,215,0,.6) 2px,
            transparent 10px
        );

    background-size:

        260px 260px,
        340px 340px,
        430px 430px;

    background-position:

        40px 70px,
        180px 20px,
        90px 160px;

    opacity: 0.7;

    animation: starsGlow 3s ease-in-out infinite alternate;
}


/* ==================================================
   STAR MOVEMENT
   ================================================== */

@keyframes starsMove {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }

    100% {
        transform: translateY(0);
    }

}


/* ==================================================
   STAR TWINKLING
   ================================================== */

@keyframes starsGlow {

    0% {
        opacity: 0.35;
        filter: brightness(0.8);
    }

    50% {
        opacity: 0.9;
        filter: brightness(1.5);
    }

    100% {
        opacity: 0.45;
        filter: brightness(1);
    }

}
    * {
        box-sizing: border-box;
    }

    body {

        background-color: black;
        color: gold;

        font-family: Arial, sans-serif;

        text-align: center;

        margin: 0;

        min-height: 100vh;

    }


    /* MAIN BOX */

    .balance-box {

        width: 90%;
        max-width: 400px;

        margin: 80px auto;

        padding: 35px 20px;

        border: 2px solid gold;

        border-radius: 25px;

        background-color: #080808;

    }


    h1 {

        margin-bottom: 30px;

        font-size: 30px;

    }


    /* BALANCE */

    #balance {

        font-size: 40px;

        font-weight: bold;

        margin: 30px 0;

        word-break: break-word;

    }


    /* ADSENSE */

    .ad-container {

        width: 90%;

        max-width: 550px;

        margin: 25px auto;

        overflow: hidden;

        text-align: center;

    }


    /* BACK BUTTON */

    .back-button {

        display: inline-block;

        padding: 12px 25px;

        color: gold;

        border: 2px solid gold;

        border-radius: 12px;

        text-decoration: none;

        font-size: 16px;

    }


    .back-button:hover {

        background-color: #222;

    }


    /* PHONE */

    @media (max-width: 500px) {

        .balance-box {

            margin: 50px auto;

            padding: 30px 15px;

        }


        h1 {

            font-size: 26px;

        }


        #balance {

            font-size: 32px;

        }


        .back-button {

            font-size: 14px;

            padding: 10px 20px;

        }

    }

</style>

</head>

<body>

<div class="balance-box">

    <h1>
        My Balance
    </h1>


    <div id="balance">

        Loading...

    </div>


    <a
        class="back-button"
        href="cryptpay.html"
    >

        ← Back to CryptPay

    </a>

</div>


<!-- =========================
     ADSENSE AD
========================= -->

<div class="ad-container">

    <ins
        class="adsbygoogle"
        style="display:block"
        data-ad-client="ca-pub-1546729568940222"
        data-ad-slot="1792055789"
        data-ad-format="auto"
        data-full-width-responsive="true">
    </ins>

</div>



<script>


    // =========================
    // LOAD ADSENSE
    // =========================

    (adsbygoogle =
        window.adsbygoogle ||
        []
    ).push({});


    // =========================
    // LOAD USER BALANCE
    // =========================

    async function loadBalance() {

        try {

            const response =
                await fetch("/me");


            const result =
                await response.json();


            // User isn't logged in

            if (!result.loggedIn) {

                window.location.href =
                    "login.html";

                return;

            }


            // Get user information

            const user =
                result.user;


            // Display balance

            document.getElementById(
                "balance"
            ).textContent =

                "₦" +
                Number(
                    user.balance || 0
                ).toLocaleString();


        }

        catch (error) {

            console.error(error);


            document.getElementById(
                "balance"
            ).textContent =

                "Unable to load balance";

        }

    }


    // Run when page loads

    loadBalance();


</script>

</body>

</html>
